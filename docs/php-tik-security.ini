; Install in the PHP-FPM and CLI conf.d directories AFTER patching PHP.
; These settings do not replace the PHP2Shell runtime security update.
expose_php = Off
display_errors = Off
log_errors = On
session.upload_progress.enabled = Off
upload_max_filesize = 2M
post_max_size = 8M
max_file_uploads = 5
max_input_nesting_level = 32
memory_limit = 256M
